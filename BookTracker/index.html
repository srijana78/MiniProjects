<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tracker — same brain as DevLog</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>📚 Book Tracker</h1>
        <p>Same engine as DevLog — different data.</p>
    </header>

    <main>
        <form id="book-form">
            <h2 id="form-title">Add a book</h2>

            <label for="title">Title</label>
            <input type="text" id="title" required placeholder="e.g. Atomic Habits">

            <label for="status">Status</label>
            <select id="status">
                <option value="To-Read">To Read</option>
                <option value="Reading">Reading</option>
                <option value="Finished">Finished</option>
            </select>

            <label for="notes">Notes</label>
            <textarea id="notes" placeholder="Your thoughts, favorite quote, etc."></textarea>

            <div>
                <button type="submit" id="submit-btn">Save book</button>
                <button type="button" id="cancel-edit">Cancel edit</button>
            </div>
        </form>

        <div id="book-list"></div>
        <p id="empty-msg" style="display:none;">No books yet — add your first one above.</p>
    </main>

   

</body>

</html>
