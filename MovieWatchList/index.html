<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie WatchList — same brain as DevLog</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
<!--  without defer,  getElementById runs before the HTML exists and return null -->
</head>

<body>

    <header>
        <h1>Movie WatchList</h1>
        <p>Same engine as DevLog — different data.</p>
    </header>

    <main>
        <form id="movie-form">
            <h2 id="movie-title">Add a Movie</h2>

            <label for="title">Title</label>
            <input type="text" id="title" required placeholder="e.g. Sita Raman">

            <label for="status">Status</label>
            <select id="status">
                <option value="To-watch">To Watch</option>
                <option value="watching">Watching</option>
                <option value="Finished">Finished</option>
            </select>

            <label for="feedback">Feedback</label>
            <textarea id="feedback" placeholder="Your thoughts, favorite dialog, etc."></textarea>

            <div id="buttons">
                <button type="submit" id="submit-btn">Save Movie</button>
                <button type="button" id="cancel-edit">Cancel edit</button>
            </div>
        </form>

        <div id="movie-list"></div>
        <p id="empty-msg">No Movies yet — add your first one above.</p>
    </main>

   

</body>

</html>
